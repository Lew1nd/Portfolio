<div class="project-card">

    <img [src]="project.image" [alt]="project.name">

    <div class="project-info">

        <h2>{{ project.name }}</h2>

        <span class="project-type">
            {{ project.type }}
        </span>

        <span class="project-status" [class]="project.status">

            {{ project.status }}

        </span>

    </div>

</div>
