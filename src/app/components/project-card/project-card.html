<div class="project-card" [routerLink]="['/projects', project.slug]">

    <img [src]="project.image" [alt]="project.name" loading="lazy" decoding="async">

    <div class="project-info">

        <h2>{{ project.name }}</h2>

        <span class="project-type">
            {{ 'projects.project-types.' + project.type | translate }}
        </span>

        <span class="project-status" [class]="project.status">

            {{ ('projects.project-status.' + project.status) | translate }}

        </span>

    </div>

</div>
