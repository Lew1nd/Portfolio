<header class="header">
    <div class="logo">
        <span class="brand">{{'header.portfolio' | translate}}</span>
    </div>

    <nav class="nav">
        <a routerLink="/">{{'header.home' | translate}}</a>
        <a routerLink="/aboutme">{{'header.about' | translate}}</a>
        <a routerLink="/">{{'header.contact' | translate}} (WIP)</a>
    </nav>

    <!--(change)="changeLanguage($event)"-->
    <select class="language-select" [(ngModel)]="language" (ngModelChange)="changeLanguage($event)">
        <option value="es">Español</option>
        <option value="en">English</option>
    </select>
</header>
